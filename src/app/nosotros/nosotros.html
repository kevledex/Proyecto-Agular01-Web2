<section class="nosotros-container">
    <div class="conocenos-block">
        <img class="hero-img" [src]="informacion.conocenos.imagen" [alt]="informacion.conocenos.alt">
        <h2>{{ informacion.conocenos.titulo }}</h2>
        <p>{{ informacion.conocenos.descripcion }}</p>
    </div>

    <div class="mision-vision-grid">
        <div class="columna">
            <img class="columna-img" [src]="informacion.mision.imagen" [alt]="informacion.mision.alt">
            <h2>{{ informacion.mision.titulo }}</h2>
            <p>{{ informacion.mision.descripcion }}</p>
        </div>

        <div class="columna">
            <img class="columna-img" [src]="informacion.vision.imagen" [alt]="informacion.vision.alt">
            <h2>{{ informacion.vision.titulo }}</h2>
            <p>{{ informacion.vision.descripcion }}</p>
        </div>
    </div>
</section>
